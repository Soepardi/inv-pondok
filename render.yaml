services:
  - type: web
    name: inv-pondok
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: APP_NAME
        value: "InvPTM"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:ywxkYd6FRQVbNoDBUb46zrThJhnSeFauluPDQUnQM3k="
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: inv-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_SEEDER
        value: "false"
    disk:
      name: storage-data
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1

databases:
  - name: inv-db
    databaseName: inv_db
    user: inv_user
    plan: basic-256mb
    diskSizeGB: 5
    region: singapore
