services:
  - type: web
    name: inv-pondok
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: APP_NAME
        value: "InvPTM"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: inv-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: inv-db
    databaseName: inv_db
    user: inv_user
    plan: starter
    region: singapore
